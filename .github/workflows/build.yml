name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore OpenLMStudio.slnx

    - name: Build
      run: dotnet build --no-restore OpenLMStudio.slnx -c Release

    - name: Test (when available)
      run: dotnet test --no-build OpenLMStudio.slnx -c Release
      if: false  # Disabled until tests are implemented